services:
  sherlock.izdrail.com:
    build:
      context: .
    container_name: sherlock.izdrail.com
    image: izdrail/sherlock.izdrail.com:latest
    restart: always
    ports:
      - "10000:10000"   # Backend service port
      - "10001:10001"   # Frontend service port      
      - "10002:10002"   # Frontend service port       - 
    volumes:
      - ./app:/home/app
      - ./frontend:/home/frontend
    environment:
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY:-}
      - ZEPTO=${ZEPTO:-}
